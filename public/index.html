<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대 달무티</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<section id="home" class="screen">
 <div class="hero"><div class="crown">♛</div><h1>대 달무티</h1><p>4–8인 로컬 실시간 카드게임</p></div>
 <div class="panel"><label>닉네임<input id="name" maxlength="14" placeholder="이름 입력"></label>
 <label>참여 인원<select id="capacity"><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option></select></label>
 <button id="create" class="primary">새 방 만들기</button><div class="or">또는</div>
 <label>방 코드<input id="roomCode" maxlength="6" placeholder="예: A7K2P" autocapitalize="characters"></label>
 <button id="join">방 참가하기</button></div>
</section>
<section id="lobby" class="screen hidden"><header><div><small>방 코드</small><strong id="code"></strong></div><span id="count"></span></header>
 <div class="panel"><h2>참가자</h2><div id="lobbyPlayers"></div><p class="hint">모든 인원이 입장하면 방장이 시작할 수 있습니다.</p><button id="start" class="primary hidden">게임 시작</button></div></section>
<section id="game" class="screen hidden">
 <header class="gameHead"><div><small id="handNo"></small><strong id="phase"></strong></div><div id="roomBadge"></div></header>
 <div id="status" class="status"></div><div id="players" class="players"></div>
 <section class="table"><div class="pileTitle">현재 묶음</div><div id="pile" class="pile empty">새 묶음</div></section>
 <section class="myarea"><div class="mytop"><h2>내 카드 <span id="handCount"></span></h2><button id="clear" class="tiny">선택 해제</button></div>
 <div id="hand" class="hand"></div><div id="actions" class="actions"></div></section>
 <details><summary>최근 기록</summary><div id="logs" class="logs"></div></details>
</section>
<div id="toast" aria-live="polite"></div>
</main><script src="app.js"></script></body></html>
